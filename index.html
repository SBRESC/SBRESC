<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBRESC - Painel Operacional</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-red: #d32f2f;
            --accent-gold: #d97706;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 20px;
        }

        /* HEADER */
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
        }

        header img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            font-weight: 800;
        }

        /* MENU / LINKS RÁPIDOS */
        nav {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }

        nav h2 {
            font-size: 1.2rem;
            margin-bottom: 12px;
            text-transform: uppercase;
            color: var(--accent-gold);
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .btn-link {
            display: block;
            background-color: #2a2a2a;
            color: var(--text-primary);
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            transition: all 0.2s ease;
            border: 1px solid var(--border-color);
        }

        .btn-link:hover {
            background-color: var(--accent-red);
            border-color: var(--accent-red);
        }

        /* DASHBOARD GRID PRINCIPAL */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1.2fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* TABELAS */
        .table-container {
            max-height: 550px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #2a2a2a;
        }

        th {
            background-color: #252525;
            position: sticky;
            top: 0;
            color: var(--accent-gold);
        }

        tr.weekend {
            background-color: rgba(211, 47, 47, 0.15);
        }

        tr.weekend td:first-child,
        tr.weekend td:nth-child(2) {
            color: #ff6b6b;
            font-weight: bold;
        }

        tr.highlight-shift {
            background-color: rgba(217, 119, 6, 0.18);
        }

        tr.highlight-shift td {
            font-weight: bold;
        }

        /* TABELA SECUNDÁRIA (PROJETOS E FÉRIAS) */
        .table-mini {
            font-size: 0.8rem;
        }

        .table-mini th, .table-mini td {
            padding: 8px 6px;
        }

        .table-mini td:first-child {
            font-weight: bold;
            color: var(--accent-gold);
            white-space: nowrap;
        }

        /* SEÇÕES SECUNDÁRIAS */
        .sub-card {
            background: #252525;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            border-left: 4px solid var(--accent-gold);
        }

        .sub-card:last-child {
            margin-bottom: 0;
        }

        .sub-card h4 {
            margin-bottom: 8px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sub-card p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }
